services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bouture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bouture}
      POSTGRES_DB: ${POSTGRES_DB:-bouture}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bouture} -d ${POSTGRES_DB:-bouture}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bouture}:${POSTGRES_PASSWORD:-bouture}@db:5432/${POSTGRES_DB:-bouture}
      PORT: 3000
      TZ: ${TZ:-Europe/Brussels}
    ports:
      - "${APP_PORT:-8088}:3000"

volumes:
  db-data:
